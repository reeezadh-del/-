name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore & verify Firebase config
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! FirebaseApp will fail to initialize."
            exit 1
          fi
          if ! grep -q "com.aistudio.separeazad.rkmxqv" app/google-services.json; then
            echo "::error::app/google-services.json does not contain com.aistudio.separeazad.rkmxqv."
            exit 1
          fi
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d ' \n\r' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 not found! Generating temporary keystore (signature will differ)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Build APK
        run: gradle :app:assembleDebug -PtargetAbis=arm64-v8a --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: SeparNet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
