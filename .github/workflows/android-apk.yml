name: Android APK Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Restore and verify original debug keystore & Firebase config
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing! FirebaseApp will fail to initialize."
            exit 1
          fi
          if ! grep -q "com.aistudio.separeazad.rkmxqv" app/google-services.json; then
            echo "::error::app/google-services.json does not contain com.aistudio.separeazad.rkmxqv."
            exit 1
          fi

          STORE_PASS="${DEBUG_KEYSTORE_PASSWORD:-android}"
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "::error::Neither DEBUG_KEYSTORE_BASE64 secret nor debug.keystore.base64 file was found."
            exit 1
          fi

          keytool -list -v -keystore debug.keystore -storepass "$STORE_PASS" > /tmp/keystore-info.txt
          ACTUAL_SHA1="$(awk -F': ' '/SHA1:/{print toupper($2); exit}' /tmp/keystore-info.txt | tr -d ' \t\r')"
          EXPECTED_SHA1="B5:27:58:87:76:73:14:99:A6:7D:9E:E0:B7:3A:4B:70:96:3B:30:EC"
          echo "Debug keystore SHA-1: $ACTUAL_SHA1"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::SHA-1 mismatch (expected $EXPECTED_SHA1, got $ACTUAL_SHA1)"
            exit 1
          fi
          echo "Original debug keystore verified."

      - name: Build APK
        run: gradle :app:assembleDebug -PtargetAbis=arm64-v8a --no-daemon --stacktrace

      - name: Verify APK output & signing certificate
        run: |
          set -euo pipefail
          APK_FILE="$(ls app/build/outputs/apk/debug/*.apk | head -n1)"
          ls -lh "$APK_FILE"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_FILE"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SeparNet-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Configure reCAPTCHA Enterprise Site Key for Release
        env:
          RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, html
          path = "app/src/main/res/values/firebase_applet_config.xml"
          if not os.path.exists(path):
              raise SystemExit("::error::app/src/main/res/values/firebase_applet_config.xml is missing!")
          with open(path, "r", encoding="utf-8") as f:
              text = f.read()
          secret_key = os.environ.get("RECAPTCHA_SITE_KEY", "").strip()
          if secret_key:
              escaped = html.escape(secret_key, quote=False)
              new_line = f'<string name="recaptcha_site_key" translatable="false">{escaped}</string>'
              if re.search(r'<string\s+name="recaptcha_site_key"[^>]*>.*?</string>', text):
                  text = re.sub(r'<string\s+name="recaptcha_site_key"[^>]*>.*?</string>', new_line, text)
              else:
                  text = text.replace("</resources>", f"    {new_line}\n</resources>")
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print("Updated recaptcha_site_key in firebase_applet_config.xml from RECAPTCHA_SITE_KEY secret.")
          else:
              m = re.search(r'<string\s+name="recaptcha_site_key"[^>]*>(.*?)</string>', text)
              if not m or not m.group(1).strip():
                  raise SystemExit("::error::recaptcha_site_key in firebase_applet_config.xml is empty and RECAPTCHA_SITE_KEY secret is not set.")
              print("Verified recaptcha_site_key in app/src/main/res/values/firebase_applet_config.xml.")
          PY

      - name: Build & Verify Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export KEYSTORE_PATH="/tmp/separnet-release-upload.jks"
          rm -f "$KEYSTORE_PATH"
          if [ -n "${KEYSTORE_BASE64}" ]; then
            if [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
              echo "::error::STORE_PASSWORD and KEY_PASSWORD secrets are required when KEYSTORE_BASE64 is set."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > "$KEYSTORE_PATH"
          else
            echo "::notice::KEYSTORE_BASE64 secret not set; signing sideload Release APK with the project's registered Firebase certificate mapped to alias 'upload'."
            cp debug.keystore "$KEYSTORE_PATH"
            keytool -changealias -alias androiddebugkey -destalias upload -keystore "$KEYSTORE_PATH" -storepass android -keypass android
            export STORE_PASSWORD="android"
            export KEY_PASSWORD="android"
          fi
          keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload
          gradle :app:assembleRelease -PtargetAbis=arm64-v8a --no-daemon --stacktrace
          rm -f "$KEYSTORE_PATH"
          APK_FILE="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          ls -lh "$APK_FILE"
          APKSIGNER="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_FILE"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: SeparNet-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload error reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: app/build/reports/
          if-no-files-found: ignore
